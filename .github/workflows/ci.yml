name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-unix:
    name: Test on ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Test All
        run: |
          make CC=${{ matrix.compiler }} clean
          make CC=${{ matrix.compiler }}
          make CC=${{ matrix.compiler }} test-all
          make CC=${{ matrix.compiler }} bench

      - name: Run Sanitizers (Linux clang only)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          make sanitize
